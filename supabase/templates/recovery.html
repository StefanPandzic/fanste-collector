<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f4f5;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #09090b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 12px; padding: 32px"
          >
            <tr>
              <td style="font-size: 18px; font-weight: 600; padding-bottom: 24px">
                Fanste Collector
              </td>
            </tr>
            <tr>
              <td style="font-size: 20px; font-weight: 600; padding-bottom: 12px">
                Reset your password
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.6; color: #3f3f46; padding-bottom: 24px">
                Someone asked to reset the password of your Fanste Collector account ({{ .Email }}).
                Open the link below to choose a new one.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password"
                  style="
                    display: inline-block;
                    background: #18181b;
                    color: #fafafa;
                    text-decoration: none;
                    font-size: 15px;
                    font-weight: 500;
                    padding: 12px 20px;
                    border-radius: 8px;
                  "
                  >Choose a new password</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 1.6; color: #71717a">
                If you didn't ask for this, you can ignore this email. Your password stays the same.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
